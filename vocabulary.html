<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary — Language Islands</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">

  <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">
    <div class="page-container">

      <div class="page-header">
        <div>
          <h1 class="page-title">Vocabulary</h1>
          <p class="page-subtitle" style="margin-bottom:0">Your word collections</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ New Set</button>
      </div>

      <div id="vocab-list" class="islands-grid"></div>

    </div>
  </main>

</div>

<!-- Modal: Create / Edit Set -->
<div id="set-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('set-modal')"></div>
  <div class="modal-box">
    <h3 id="modal-title">New Set</h3>
    <form onsubmit="submitSetForm(event)">
      <input type="hidden" id="set-id">
      <div class="form-group">
        <label for="set-name">Set name</label>
        <input type="text" id="set-name" placeholder="e.g. Colours, Numbers, Food..." required>
      </div>
      <div class="form-group">
        <label for="native-lang">Native language</label>
        <input type="text" id="native-lang" placeholder="e.g. English" required>
      </div>
      <div class="form-group">
        <label for="target-lang">Target language</label>
        <input type="text" id="target-lang" placeholder="e.g. French" required>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('set-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div id="delete-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('delete-modal')"></div>
  <div class="modal-box">
    <h3>Delete Set</h3>
    <p>Are you sure? This will delete the set and all its words.</p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger"    onclick="confirmDeleteSet()">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/vocabulary.js"></script>
</body>
</html>
