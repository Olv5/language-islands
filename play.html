<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player — Language Islands</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a id="back-link" href="index.html" class="back-link">← Voltar</a>
      <span class="logo">Language Islands</span>
    </div>
  </header>

  <main class="container">

    <!-- Nome e idiomas da ilha -->
    <div class="player-meta">
      <span id="player-island-name" class="player-island-name"></span>
      <span id="player-island-langs" class="player-island-langs"></span>
    </div>

    <!-- Card principal -->
    <div class="player-card">

      <!-- Cabeçalho de progresso -->
      <div class="player-progress-header">
        <span id="progress-text" class="player-progress-text">Frase — de —</span>
        <span id="rep-text"      class="player-rep-text"></span>
      </div>

      <!-- Barra de progresso -->
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width:0%"></div>
      </div>

      <!-- Visualização da frase -->
      <div id="phrase-display">
        <p id="display-native" class="display-native"></p>
        <p id="display-target" class="display-target"></p>
        <p id="display-status" class="display-status"></p>
      </div>

      <!-- Estado: concluído (escondido até terminar) -->
      <div id="finished-display" class="finished-display hidden">
        <div class="finished-icon">✓</div>
        <p class="finished-text">Ilha concluída!</p>
        <button class="btn btn-primary" onclick="resetAndPlay()">Recomeçar</button>
      </div>

    </div>

    <!-- Controlos principais -->
    <div class="player-controls">
      <button class="ctrl-btn ctrl-skip" onclick="prevPhrase()" title="Frase anterior">⏮</button>
      <button class="ctrl-btn ctrl-play" id="btn-play" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn ctrl-skip" onclick="nextPhrase()" title="Próxima frase">⏭</button>
    </div>

    <div class="player-secondary">
      <button class="btn btn-secondary btn-sm" onclick="stopPlayer()">⏹ Parar</button>
    </div>

    <!-- Painel de definições -->
    <div class="settings-panel">
      <button class="settings-toggle" onclick="toggleSettings()">
        ⚙ Definições
        <span id="settings-arrow">▼</span>
      </button>
      <div id="settings-content" class="settings-content hidden">

        <div class="setting-row">
          <label>Repetições por frase</label>
          <div class="setting-control">
            <button onclick="adjustSetting('repetitions', -1)">−</button>
            <span id="s-reps-value">—</span>
            <button onclick="adjustSetting('repetitions', +1)">+</button>
          </div>
        </div>

        <div class="setting-row">
          <label>Pausa entre repetições</label>
          <div class="setting-control">
            <button onclick="adjustSetting('pauseBetweenReps', -0.5)">−</button>
            <span id="s-pause-reps-value">—</span>
            <button onclick="adjustSetting('pauseBetweenReps', +0.5)">+</button>
          </div>
        </div>

        <div class="setting-row">
          <label>Pausa entre frases</label>
          <div class="setting-control">
            <button onclick="adjustSetting('pauseBetweenPhrases', -0.5)">−</button>
            <span id="s-pause-phrases-value">—</span>
            <button onclick="adjustSetting('pauseBetweenPhrases', +0.5)">+</button>
          </div>
        </div>

      </div>
    </div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>

  <script src="js/storage.js"></script>
  <script src="js/player.js"></script>

</body>
</html>
