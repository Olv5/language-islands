<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islands — Language Islands</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">

  <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">
    <div class="page-container">

      <div class="page-header">
        <div>
          <h1 class="page-title">Islands</h1>
          <p class="page-subtitle" style="margin-bottom:0">Your language learning collections</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ New Island</button>
      </div>

      <div id="islands-list" class="islands-grid"></div>

    </div>
  </main>

</div>

<!-- Modal: Create / Edit Island -->
<div id="island-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('island-modal')"></div>
  <div class="modal-box">
    <h3 id="modal-title">New Island</h3>
    <form onsubmit="submitIslandForm(event)">
      <input type="hidden" id="island-id">
      <div class="form-group">
        <label for="island-name">Island name</label>
        <input type="text" id="island-name" placeholder="e.g. Gym, Work, Travel..." required>
      </div>
      <div class="form-group">
        <label for="native-lang">Native language</label>
        <input type="text" id="native-lang" placeholder="e.g. English" required>
      </div>
      <div class="form-group">
        <label for="target-lang">Target language</label>
        <input type="text" id="target-lang" placeholder="e.g. French" required>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('island-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div id="delete-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('delete-modal')"></div>
  <div class="modal-box">
    <h3>Delete Island</h3>
    <p>Are you sure? This will delete the island and all its phrases.</p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger"    onclick="confirmDeleteIsland()">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/islands.js"></script>
</body>
</html>
