<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island — Language Islands</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">

  <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">
    <div class="page-container">

      <div class="island-info">
        <a href="islands.html" style="font-size:0.8rem;color:var(--gray-500);text-decoration:none;display:inline-block;margin-bottom:0.5rem;">← Back to Islands</a>
        <h2 id="island-title">...</h2>
        <span id="island-langs-display" class="island-langs"></span>
      </div>

      <!-- Player Bar -->
      <div class="island-player-bar">
        <div class="ipb-left">
          <button class="ipb-btn"  onclick="prevPhrase()" title="Previous">⏮</button>
          <button class="ipb-btn ipb-play" id="bar-play-btn" onclick="togglePlay()">▶</button>
          <button class="ipb-btn"  onclick="nextPhrase()" title="Next">⏭</button>
          <button class="ipb-btn"  onclick="stopPlayer()" title="Stop">⏹</button>
          <button class="ipb-btn"  id="loop-btn"    onclick="toggleLoop()"        title="Loop">🔁</button>
          <button class="ipb-btn"  id="writing-btn" onclick="toggleWritingMode()" title="Writing mode">✏</button>
          <div class="ipb-info">
            <span id="bar-rep-text"      class="ipb-rep"></span>
            <span id="bar-progress-text" class="ipb-progress"></span>
          </div>
        </div>
        <div class="ipb-right">
          <button id="blur-toggle" class="btn btn-secondary btn-sm hidden"
            onclick="toggleBlur()">👁 Hide</button>
          <button class="ipb-btn" id="settings-btn"
            onclick="toggleSettings()" title="Settings">⚙</button>
        </div>
      </div>

      <!-- Settings Panel -->
      <div id="settings-content" class="settings-content hidden"
        style="margin-bottom:0.75rem; border-radius:0 0 var(--radius) var(--radius); border-top:none;">
        <div class="setting-row">
          <label>Repetitions per phrase</label>
          <div class="setting-control">
            <button onclick="adjustSetting('repetitions', -1)">−</button>
            <span id="s-reps-value">—</span>
            <button onclick="adjustSetting('repetitions', +1)">+</button>
          </div>
        </div>
        <div class="setting-row">
          <label>Pause between repetitions</label>
          <div class="setting-control">
            <button onclick="adjustSetting('pauseBetweenReps', -0.5)">−</button>
            <span id="s-pause-reps-value">—</span>
            <button onclick="adjustSetting('pauseBetweenReps', +0.5)">+</button>
          </div>
        </div>
        <div class="setting-row">
          <label>Pause between phrases</label>
          <div class="setting-control">
            <button onclick="adjustSetting('pauseBetweenPhrases', -0.5)">−</button>
            <span id="s-pause-phrases-value">—</span>
            <button onclick="adjustSetting('pauseBetweenPhrases', +0.5)">+</button>
          </div>
        </div>
      </div>

      <!-- Writing Panel -->
      <div id="writing-panel" class="writing-panel hidden">
        <div class="writing-header">
          <span class="writing-label">Translate to <span id="writing-target-lang"></span>:</span>
          <button class="speaker-btn" id="writing-replay-btn"
            onclick="replayWritingAudio()" title="Listen again">🔊</button>
        </div>
        <p id="writing-native-text" class="writing-native"></p>
        <div class="writing-input-row">
          <input type="text" id="writing-input"
            placeholder="Write here..."
            onkeydown="handleWritingKey(event)">
          <button class="btn btn-primary" onclick="submitWriting()">✓</button>
        </div>
        <div id="writing-feedback" class="writing-feedback hidden">
          <p id="writing-result"         class="writing-result"></p>
          <p id="writing-correct-answer" class="writing-correct"></p>
          <button class="btn btn-secondary btn-sm"
            style="margin-top:0.75rem;width:100%"
            onclick="advanceWriting()">Next →</button>
        </div>
      </div>

      <!-- Phrases -->
      <div class="page-header" style="margin-top:1.5rem">
        <h3>Phrases</h3>
        <div style="display:flex;gap:0.5rem;">
          <button class="btn btn-secondary" onclick="openImportModal()">📥 Import</button>
          <button class="btn btn-primary"   onclick="openCreateModal()">+ New Phrase</button>
        </div>
      </div>

      <div id="phrases-list" class="phrases-list"></div>

    </div>
  </main>

</div>

<!-- Modal: Create / Edit Phrase -->
<div id="phrase-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('phrase-modal')"></div>
  <div class="modal-box">
    <h3 id="phrase-modal-title">New Phrase</h3>
    <form onsubmit="submitPhraseForm(event)">
      <input type="hidden" id="phrase-id">
      <div class="form-group">
        <label id="label-native">Native text</label>
        <textarea id="phrase-native" rows="2" required placeholder="e.g. How many sets are left?"></textarea>
      </div>
      <div class="form-group">
        <label id="label-target">Target text</label>
        <textarea id="phrase-target" rows="2" required placeholder="e.g. Combien de séries reste-t-il ?"></textarea>
      </div>
      <div class="form-group">
        <label>Audio (optional)</label>
        <div id="current-audio-section" class="audio-section hidden">
          <p class="form-hint">Current audio:</p>
          <audio id="current-audio-player" controls class="phrase-audio"></audio>
          <button type="button" class="btn btn-secondary btn-sm"
            style="margin-top:0.5rem" onclick="removeCurrentAudio()">Remove audio</button>
        </div>
        <input type="file" id="phrase-audio-file" accept="audio/*" onchange="handleAudioUpload(event)">
        <p class="form-hint">Accepted: MP3, OGG, WAV. Max 2MB.</p>
        <div id="new-audio-section" class="audio-section hidden">
          <p class="form-hint">Preview:</p>
          <audio id="new-audio-player" controls class="phrase-audio"></audio>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('phrase-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div id="delete-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('delete-modal')"></div>
  <div class="modal-box">
    <h3>Delete Phrase</h3>
    <p>Are you sure you want to delete this phrase?</p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger"    onclick="confirmDeletePhrase()">Delete</button>
    </div>
  </div>
</div>

<!-- Modal: Import -->
<div id="import-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('import-modal')"></div>
  <div class="modal-box modal-box-wide">
    <h3>Import phrases</h3>

    <div class="import-section">
      <label class="import-label">
        1. Paste your phrases
        <span class="form-hint">Format per line: French text -> English text</span>
      </label>
      <textarea id="import-text" rows="6"
        placeholder="Combien de séries reste-t-il ? -> How many sets are left?
Je suis épuisé. -> I am exhausted.
C'est trop lourd pour moi. -> It's too heavy for me."
        oninput="updateImportPreview()"></textarea>
    </div>

    <div class="import-section">
      <label class="import-label">
        2. Select audio files
        <span class="form-hint">You can select multiple files at once</span>
      </label>
      <input type="file" id="import-audio-files" accept="audio/*" multiple onchange="updateImportPreview()">
    </div>

    <div id="import-preview" class="import-preview hidden">
      <p class="import-preview-title">Preview</p>
      <div class="import-table-wrap">
        <table class="import-table">
          <thead>
            <tr>
              <th class="col-num">#</th>
              <th>Target text</th>
              <th>Native text</th>
              <th class="col-audio">Audio</th>
            </tr>
          </thead>
          <tbody id="import-table-body"></tbody>
        </table>
      </div>
      <p id="import-summary" class="import-summary"></p>
    </div>

    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('import-modal')">Cancel</button>
      <button class="btn btn-primary" id="import-submit-btn" onclick="submitImport()" disabled>Import</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/phrases.js"></script>
</body>
</html>
