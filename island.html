<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilha — Language Islands</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="back-link">← Voltar</a>
      <span class="logo">Language Islands</span>
    </div>
  </header>

  <main class="container">

    <div class="island-info">
      <h2 id="island-title">...</h2>
      <span id="island-langs-display" class="island-langs"></span>
    </div>

    <!-- Barra de player integrada -->
    <div class="island-player-bar">
      <div class="ipb-left">
        <button class="ipb-btn" onclick="prevPhrase()" title="Anterior">⏮</button>
        <button class="ipb-btn ipb-play" id="bar-play-btn" onclick="togglePlay()">▶</button>
        <button class="ipb-btn" onclick="nextPhrase()" title="Seguinte">⏭</button>
        <button class="ipb-btn" onclick="stopPlayer()" title="Parar">⏹</button>
        <div class="ipb-info">
          <span id="bar-rep-text"      class="ipb-rep"></span>
          <span id="bar-progress-text" class="ipb-progress"></span>
        </div>
      </div>
      <div class="ipb-right">
        <button id="blur-toggle" class="btn btn-secondary btn-sm"
          onclick="toggleBlur()">👁 Ocultar</button>
        <button class="ipb-btn" id="settings-btn"
          onclick="toggleSettings()" title="Definições">⚙</button>
      </div>
    </div>

    <!-- Painel de definições (colapsável) -->
    <div id="settings-content" class="settings-content hidden"
      style="margin-bottom:0.75rem; border-radius: var(--radius);">
      <div class="setting-row">
        <label>Repetições por frase</label>
        <div class="setting-control">
          <button onclick="adjustSetting('repetitions', -1)">−</button>
          <span id="s-reps-value">—</span>
          <button onclick="adjustSetting('repetitions', +1)">+</button>
        </div>
      </div>
      <div class="setting-row">
        <label>Pausa entre repetições</label>
        <div class="setting-control">
          <button onclick="adjustSetting('pauseBetweenReps', -0.5)">−</button>
          <span id="s-pause-reps-value">—</span>
          <button onclick="adjustSetting('pauseBetweenReps', +0.5)">+</button>
        </div>
      </div>
      <div class="setting-row">
        <label>Pausa entre frases</label>
        <div class="setting-control">
          <button onclick="adjustSetting('pauseBetweenPhrases', -0.5)">−</button>
          <span id="s-pause-phrases-value">—</span>
          <button onclick="adjustSetting('pauseBetweenPhrases', +0.5)">+</button>
        </div>
      </div>
    </div>

    <div class="page-header" style="margin-top:1.5rem">
      <h3>Frases</h3>
      <button class="btn btn-primary" onclick="openCreateModal()">+ Nova frase</button>
    </div>

    <div id="phrases-list" class="phrases-list"></div>

  </main>

  <!-- Modal: Criar / Editar Frase -->
  <div id="phrase-modal" class="modal hidden">
    <div class="modal-overlay" onclick="closeModal('phrase-modal')"></div>
    <div class="modal-box">
      <h3 id="phrase-modal-title">Nova frase</h3>
      <form onsubmit="submitPhraseForm(event)">
        <input type="hidden" id="phrase-id">
        <div class="form-group">
          <label id="label-native">Texto nativo</label>
          <textarea id="phrase-native" rows="2" required
            placeholder="ex: Quantas séries faltam?"></textarea>
        </div>
        <div class="form-group">
          <label id="label-target">Texto alvo</label>
          <textarea id="phrase-target" rows="2" required
            placeholder="ex: Combien de séries reste-t-il ?"></textarea>
        </div>
        <div class="form-group">
          <label>Áudio (opcional)</label>
          <div id="current-audio-section" class="audio-section hidden">
            <p class="form-hint">Áudio actual:</p>
            <audio id="current-audio-player" controls class="phrase-audio"></audio>
            <button type="button" class="btn btn-secondary btn-sm"
              style="margin-top:0.5rem" onclick="removeCurrentAudio()">Remover áudio</button>
          </div>
          <input type="file" id="phrase-audio-file"
            accept="audio/*" onchange="handleAudioUpload(event)">
          <p class="form-hint">Formatos aceites: MP3, OGG, WAV. Máximo 2MB.</p>
          <div id="new-audio-section" class="audio-section hidden">
            <p class="form-hint">Pré-visualização:</p>
            <audio id="new-audio-player" controls class="phrase-audio"></audio>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary"
            onclick="closeModal('phrase-modal')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Confirmar Eliminação -->
  <div id="delete-modal" class="modal hidden">
    <div class="modal-overlay" onclick="closeModal('delete-modal')"></div>
    <div class="modal-box">
      <h3>Eliminar frase</h3>
      <p>Tens a certeza que queres eliminar esta frase?</p>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancelar</button>
        <button class="btn btn-danger"    onclick="confirmDeletePhrase()">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/phrases.js"></script>

</body>
</html>
