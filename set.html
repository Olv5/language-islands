<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set — Language Islands</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">

  <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">
    <div class="page-container">

      <div class="island-info">
        <a href="vocabulary.html" style="font-size:0.8rem;color:var(--gray-500);text-decoration:none;display:inline-block;margin-bottom:0.5rem;">← Back to Vocabulary</a>
        <h2 id="set-title">...</h2>
        <span id="set-langs-display" class="island-langs"></span>
      </div>

      <div class="page-header">
        <h3>Words</h3>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <button id="blur-toggle" class="btn btn-secondary btn-sm hidden"
            onclick="toggleBlur()">👁 Hide</button>
          <button class="btn btn-primary" onclick="openCreateModal()">+ New Word</button>
        </div>
      </div>

      <div id="words-list" class="words-list"></div>

    </div>
  </main>

</div>

<!-- Modal: Create / Edit Word -->
<div id="word-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('word-modal')"></div>
  <div class="modal-box">
    <h3 id="word-modal-title">New Word</h3>
    <form onsubmit="submitWordForm(event)">
      <input type="hidden" id="word-id">
      <div class="form-group">
        <label id="label-native">Native word</label>
        <input type="text" id="word-native" required placeholder="e.g. Cat">
      </div>
      <div class="form-group">
        <label id="label-target">Target word</label>
        <input type="text" id="word-target" required placeholder="e.g. Chat">
      </div>
      <div class="form-group">
        <label>Audio (optional)</label>
        <div id="current-audio-section" class="audio-section hidden">
          <p class="form-hint">Current audio:</p>
          <audio id="current-audio-player" controls class="phrase-audio"></audio>
          <button type="button" class="btn btn-secondary btn-sm"
            style="margin-top:0.5rem" onclick="removeCurrentAudio()">Remove audio</button>
        </div>
        <input type="file" id="word-audio-file" accept="audio/*" onchange="handleAudioUpload(event)">
        <p class="form-hint">Accepted: MP3, OGG, WAV. Max 2MB.</p>
        <div id="new-audio-section" class="audio-section hidden">
          <p class="form-hint">Preview:</p>
          <audio id="new-audio-player" controls class="phrase-audio"></audio>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('word-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div id="delete-modal" class="modal hidden">
  <div class="modal-overlay" onclick="closeModal('delete-modal')"></div>
  <div class="modal-box">
    <h3>Delete Word</h3>
    <p>Are you sure you want to delete this word?</p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger"    onclick="confirmDeleteWord()">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/set.js"></script>
</body>
</html>
